<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>GGEZ Developer Console</title><link rel="manifest" href="/manifest.webmanifest"><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#000;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:#000}.wrap{max-width:760px;margin:auto;padding:22px}.brand{color:#b79aff;font-weight:800;letter-spacing:.12em}.muted{color:#aaa}.panel,.claim{background:#111;border:1px solid #292929;border-radius:18px;padding:18px;margin:16px 0}input,button,textarea{font:inherit;border-radius:12px;padding:13px;border:1px solid #444;background:#080808;color:#fff;width:100%}button{cursor:pointer;background:#282039;border-color:#7256a7;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.approve{background:#164d35;border-color:#267a51}.deny{background:#4b1d25;border-color:#8c3444}.meta{font-size:.9rem;color:#bbb;overflow-wrap:anywhere}.hidden{display:none}.pill{color:#d0baff;font-size:.8rem}h1{margin:.3rem 0 0}.claim h3{margin:0 0 8px}.empty{text-align:center;padding:36px;color:#aaa}label{display:block;margin:12px 0 6px}
</style></head><body><main class="wrap"><div class="brand">GGEZ / PRIVATE</div><h1>Developer Console</h1><p class="muted">Purchase authorization queue only.</p><section id="login" class="panel"><label for="key">Owner authorization key</label><input id="key" type="password" autocomplete="current-password" placeholder="Enter server OWNER_ADMIN_KEY"><p class="meta">The key is sent only to your own server. Do not share it or store it in the keyboard APK.</p><button id="connect">Open authorization queue</button><p id="loginError" class="meta"></p></section><section id="queue" class="hidden"><div class="row"><button id="refresh">Refresh queue</button><button id="logout">Lock console</button></div><p class="meta" id="status">Waiting for requests…</p><div id="claims"></div></section></main><script>
let ownerKey='';const $=id=>document.getElementById(id);function auth(){return {Authorization:'Bearer '+ownerKey,'Content-Type':'application/json'}}
async function load(){try{const r=await fetch('/v1/admin/claims',{headers:auth()});if(!r.ok)throw Error((await r.json()).error||'Authorization failed');const data=await r.json();$('status').textContent=data.pending.length+' pending request(s)';$('claims').innerHTML='';if(!data.pending.length){$('claims').innerHTML='<div class="panel empty">No pending authorization requests.</div>';return}for(const c of data.pending){const el=document.createElement('article');el.className='claim';const safe=v=>String(v||'—').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));el.innerHTML=`<div class="pill">${safe(c.plan)} · ${safe(c.payment_method)}</div><h3>${safe(c.email)}</h3><div class="meta">Reference: ${safe(c.payer_reference)}<br>Payer: ${safe(c.payer_name)}<br>Submitted: ${safe(c.submitted_at)}<br>Note: ${safe(c.note)}</div><label>Review note (optional)</label><input class="note" maxlength="300" placeholder="Verification note"><div class="row" style="margin-top:12px"><button class="approve">Approve</button><button class="deny">Deny</button></div>`;el.querySelector('.approve').onclick=()=>review(c.id,'approve',el.querySelector('.note').value);el.querySelector('.deny').onclick=()=>review(c.id,'deny',el.querySelector('.note').value);$('claims').append(el)}}catch(e){$('status').textContent=e.message}}
async function review(id,decision,note){if(decision==='approve'&&!confirm('Approve this purchase and unlock Plugin Studio?'))return;if(decision==='deny'&&!confirm('Deny this authorization request?'))return;const r=await fetch('/v1/admin/claims/'+encodeURIComponent(id)+'/review',{method:'POST',headers:auth(),body:JSON.stringify({decision,note})});const d=await r.json();if(!r.ok){alert(d.error||'Review failed');return}await load()}
$('connect').onclick=async()=>{ownerKey=$('key').value.trim();await load();if($('status').textContent.includes('pending request')||$('status').textContent==='No pending authorization requests.'){$('login').classList.add('hidden');$('queue').classList.remove('hidden')}};$('refresh').onclick=load;$('logout').onclick=()=>{ownerKey='';$('key').value='';$('queue').classList.add('hidden');$('login').classList.remove('hidden')};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
